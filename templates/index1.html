<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRouteXplorer</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9; /* Subtle gray background */
            color: #333;
        }
    
        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #81c784, #a5d6a7); /* Light green gradient */
            color: white;
            padding: 15px 0;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav .logo {
    font-size: 2em;
    font-weight: bold;
    color: white;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-transform: none; /* Exact casing */
}
    
        nav .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
    
        .nav-buttons .btn {
            background-color: white;
            color: #388e3c; /* Green button text */
            padding: 12px 25px;
            border: none;
            border-radius: 30px; /* Rounded buttons */
            font-size: 1em;
            font-weight: bold;
            text-transform: capitalize;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    
        .nav-buttons .btn:hover {
            background: #66bb6a; /* Green hover effect */
            color: white;
            transform: translateY(-3px);
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
        }
    
        /* Safest Route Section */
        .safest-route-display {
            margin: 120px auto 20px; /* Space for the navbar */
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9); /* Light green gradient */
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
        }
    
        .safest-route-display h3 {
            color: #388e3c; /* Dark green text */
            font-weight: bold;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
    
        .safest-route-display p {
            color: #555;
            font-size: 1.1em;
            margin: 10px 0;
            font-weight: 500;
        }
    
        /* Map Container */
        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px; /* Space below safest route display */
        }
    
        /* General Button Styling (Primary Button) */
        .btn-primary {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            background: #388e3c; /* Solid green */
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
    
        .btn-primary:hover {
            background: #2e7d32; /* Darker green on hover */
            transform: translateY(-2px);
        }
       /* Routes Container */
       #routes-container {
            margin: 20px auto;
            padding: 20px;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Route Card */
        .route-info {
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid transparent; /* Default border */
        }

        .route-info:hover {
            transform: translateY(-3px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #4CAF50; /* Highlight border on hover */
        }

        .safest-route {
            border-left: 5px solid #4CAF50; /* Highlight the safest route */
            background-color: #e8f5e9; /* Subtle green background */
        }

        .route-info strong {
            font-size: 1.2em;
            font-weight: bold;
            color: #388e3c; /* Green text for route titles */
        }

        .route-info p {
            margin: 5px 0;
            color: #555;
            line-height: 1.5;
        }

    </style>
    
    

    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMap" async defer></script>
</head>
<body>
    <nav>
        <div class="logo">SafeRouteXplorer</div>
        <div class="nav-buttons">
            <button class="btn">Enable Real-Time Safety Alerts</button>
            <button class="btn">Search Any Location</button>
            <button class="btn">Your Timeline</button>
            <button class="btn">Set Start & End Location</button>
        </div>
    </nav>
    

    <div class="safest-route-display">
        <h3>Safest Route from Rawalpindi to Islamabad</h3>
    </div>

    <div id="map"></div>
    <div id="routes-container"></div>
    <div id="safety-info"></div>

    <script>
        let map, directionsService, directionsRenderers = [];

        function initMap() {
            // Initialize the map
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 33.6844, lng: 73.0479 }, // Rawalpindi as default center
                zoom: 12,
            });

            // Initialize DirectionsService
            directionsService = new google.maps.DirectionsService();

            // Fetch and display the routes
            fetchRoutes();
        }

        function fetchRoutes() {
            fetch('/get_route_data') // Fetch route data from Flask backend
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("safety-info").innerText = "No routes found.";
                        return;
                    }

                    // Clear existing routes
                    clearRoutes();

                    // Find the safest route
                    const safestRouteIndex = data.routes.reduce((minIndex, route, currentIndex, arr) => 
                        route.safety_index < arr[minIndex].safety_index ? currentIndex : minIndex
                    , 0);

                    // Create request for directions service
                    const request = {
                        origin: "Rawalpindi", // Starting location
                        destination: "Islamabad", // Ending location
                        travelMode: google.maps.TravelMode.DRIVING,
                        provideRouteAlternatives: true
                    };

                    // Get directions and display them
                    directionsService.route(request, function(response, status) {
                        if (status === 'OK') {
                            const routesContainer = document.getElementById('routes-container');
                            routesContainer.innerHTML = ''; // Clear existing route information

                            response.routes.forEach((route, index) => {
                                // Create a new DirectionsRenderer for each route
                                const renderer = new google.maps.DirectionsRenderer({
                                    map: map,
                                    directions: response,
                                    routeIndex: index,
                                    polylineOptions: {
                                        strokeColor: index === safestRouteIndex ? '#4CAF50' : '#FF0000', // Green for safest route, red for others
                                        strokeWeight: index === safestRouteIndex ? 6 : 4,
                                        strokeOpacity: index === safestRouteIndex ? 1.0 : 0.7
                                    },
                                    suppressMarkers: true // We handle our own markers
                                });
                                directionsRenderers.push(renderer);

                                // Add route information to the container
                                const routeInfo = document.createElement('div');
                                routeInfo.className = `route-info ${index === safestRouteIndex ? 'safest-route' : ''}`;
                                routeInfo.innerHTML = ` 
                                    <strong>Route ${index + 1}</strong><br>
                                    Distance: ${route.legs[0].distance.text}<br>
                                    Duration: ${route.legs[0].duration.text}<br>
                                    Danger Index: ${data.routes[index].safety_index.toFixed(2)}
                                    ${index === safestRouteIndex ? '<br><strong>(Safest Route)</strong>' : ''}`;
                                routesContainer.appendChild(routeInfo);
                            });

                            // Add markers for all danger points (CSV + Manual points)
                            data.danger_points.forEach(point => {
                                new google.maps.Marker({
                                    position: { lat: point.lat, lng: point.lng },
                                    map: map,
                                    title: `Danger Index: ${point.danger_index}`,
                                    icon: {
                                        path: google.maps.SymbolPath.CIRCLE,
                                        fillColor: getColorForDangerIndex(point.danger_index),
                                        fillOpacity: 0.8,
                                        strokeWeight: 1,
                                        scale: 6
                                    }
                                });
                            });

                            // Fit bounds to include all routes and danger points
                            const bounds = new google.maps.LatLngBounds();
                            response.routes.forEach(route => {
                                route.legs.forEach(leg => {
                                    leg.steps.forEach(step => {
                                        step.path.forEach(point => {
                                            bounds.extend(point);
                                        });
                                    });
                                });
                            });

                            // Add danger points to bounds
                            data.danger_points.forEach(point => {
                                bounds.extend(new google.maps.LatLng(point.lat, point.lng));
                            });

                            map.fitBounds(bounds);
                        } else {
                            console.error('Directions request failed due to ' + status);
                            document.getElementById("safety-info").innerText = "Error fetching route data.";
                        }
                    });
                })
                .catch(error => {
                    console.error("Error fetching route data:", error);
                    document.getElementById("safety-info").innerText = "Error fetching route data.";
                });
        }

        function clearRoutes() {
            directionsRenderers.forEach(renderer => {
                renderer.setMap(null);  // Remove the route from the map
            });
            directionsRenderers = []; // Reset the array for next routes
        }

        function getColorForDangerIndex(dangerIndex) {
            if (dangerIndex === 3) return "red";    // High danger
            if (dangerIndex === 2) return "orange"; // Medium danger
            return "yellow";   // Low danger
        }
    </script>
</body>
</html>
