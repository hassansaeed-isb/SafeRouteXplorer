<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRouteXplorer</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
    
        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #81c784, #a5d6a7);
            color: white;
            padding: 15px 0;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav .logo {
            font-size: 2em;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: none;
        }
    
        nav .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
    
        .nav-buttons .btn {
            background-color: white;
            color: #388e3c;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1em;
            font-weight: bold;
            text-transform: capitalize;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    
        .nav-buttons .btn:hover {
            background: #66bb6a;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
        }
    
        /* Safest Route Section */
        .safest-route-display {
            margin: 120px auto 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
        }
    
        .safest-route-display h3 {
            color: #388e3c;
            font-weight: bold;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
    
        /* Map Container */
        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
    
        /* Routes Container */
        #routes-container {
            margin: 20px auto;
            padding: 20px;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .route-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            border-left: 5px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .route-card:hover {
            transform: translateY(-3px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #4CAF50;
        }

        .route-card.safest {
            background: #E8F5E9;
            border-left: 5px solid #4CAF50;
        }

        /* Navigation Info */
        #nav-info {
            margin-top: 10px;
            background: #eee;
            padding: 10px;
            border-radius: 6px;
            min-height: 50px;
        }

        /* Notification System */
        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            font-size: 1.2em;
            font-weight: bold;
        }

        /* Location Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }
    </style>

    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMap" async defer></script>
</head>
<body>
    <nav>
        <div class="logo">SafeRouteXplorer</div>
        <div class="nav-buttons">
            <button class="btn" id="enable-alerts">Enable Real-Time Safety Alerts</button>
            <button class="btn" id="start-nav">Start Navigation</button>
            <button class="btn" id="stop-nav" style="display:none;">Stop Navigation</button>
            <button class="btn" id="set-location">Set Location</button>
            <button class="btn" id="simulate-movement">Simulate Movement</button>
        </div>
    </nav>

    <div class="safest-route-display">
        <h3>Safest Route from Rawalpindi to Islamabad</h3>
    </div>

    <div id="nav-info">No navigation active.</div>
    <div id="map"></div>
    <div id="routes-container"></div>
    <div id="notification"></div>

    <!-- Audio for alerts -->
    <audio id="alertSound">
        <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
        <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.mp3" type="audio/mpeg">
    </audio>

    <!-- Location Modal -->
    <div id="location-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Set Route Locations</h2>
            <form id="location-form">
                <div class="input-group">
                    <label for="start-location">Start Location:</label>
                    <input type="text" id="start-location" required placeholder="Enter starting point">
                </div>
                <div class="input-group">
                    <label for="end-location">End Location:</label>
                    <input type="text" id="end-location" required placeholder="Enter destination">
                </div>
                <button type="submit" class="btn">Find Safe Routes</button>
            </form>
        </div>
    </div>

    <script>
        let map, directionsService, directionsRenderers = [];
        let userMarker = null;
        let watchId = null;
        let navStartTime = null;
        let allRoutes = [];
        let routePolylines = [];
        let chosenRouteIndex = null;
        let dangerPointsData = [];
        let notifiedCrimes = new Set();
        let currentDestination = "Islamabad";
        

        // Simulation variables
        const simulatedPath = [
    { lat: 33.6844, lng: 73.0479 }, // Starting point
    { lat: 33.6922, lng: 73.0490 }, // Moving towards Demo Zone 1
    { lat: 33.7000, lng: 73.0500 }, // Demo Incident 1 location
    { lat: 33.7100, lng: 73.0550 }, // Moving between points
    { lat: 33.7200, lng: 73.0600 }  // Demo Incident 2 location
];
        let simulationIndex = 0;
        let simulationInterval = null;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 33.6844, lng: 73.0479 },
                zoom: 12
            });

            directionsService = new google.maps.DirectionsService();
            initializeModal();
            fetchRoutes();

            // Initialize button listeners
            document.getElementById("start-nav").addEventListener("click", startNavigation);
            document.getElementById("stop-nav").addEventListener("click", stopNavigation);
            document.getElementById("simulate-movement").addEventListener("click", simulateMovement);
        }

        function initializeModal() {
            const modal = document.getElementById("location-modal");
            const locationBtn = document.getElementById("set-location");
            const closeBtn = document.querySelector(".close-btn");
            const locationForm = document.getElementById("location-form");

            locationBtn.addEventListener("click", () => {
                modal.style.display = "block";
            });

            closeBtn.addEventListener("click", () => {
                modal.style.display = "none";
            });

            window.addEventListener("click", (event) => {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });

            locationForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const startLocation = document.getElementById("start-location").value;
                const endLocation = document.getElementById("end-location").value;
                
                document.querySelector(".safest-route-display h3").textContent = 
                    `Safest Route from ${startLocation} to ${endLocation}`;
                
                fetchRoutes(startLocation, endLocation);
                modal.style.display = "none";
            });
        }

        function fetchRoutes(startLocation = "Rawalpindi", endLocation = "Islamabad") {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const url = `/get_route_data?origin_lat=${pos.coords.latitude}&origin_lng=${pos.coords.longitude}&destination=${encodeURIComponent(endLocation)}`;
                        fetchRouteData(url);
                    },
                    () => {
                        const url = `/get_route_data`;
                        fetchRouteData(url);
                    }
                );
            } else {
                const url = `/get_route_data`;
                fetchRouteData(url);
            }
        }

        function fetchRouteData(url) {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error(data.error);
                        return;
                    }

                    dangerPointsData = data.danger_points;
                    displayRoutes(data.routes);
                    displayDangerPoints();
                })
                .catch(error => {
                    console.error("Error fetching routes:", error);
                });
        }

        function displayRoutes(routes) {
            clearRoutes();
            const routesContainer = document.getElementById('routes-container');
            routesContainer.innerHTML = '';

            routes.forEach((route, index) => {
                const isSafest = route.is_safest;
                
                // Create route card
                const card = document.createElement('div');
                card.className = `route-card ${isSafest ? 'safest' : ''}`;
                card.innerHTML = `
                    <h4>Route ${index + 1}</h4>
                    <p><strong>Distance:</strong> ${route.distance || 'N/A'}</p>
                    <p><strong>Duration:</strong> ${route.duration || 'N/A'}</p>
                    <p><strong>Safety Index:</strong> ${route.safety_index}</p>
                    ${isSafest ? '<p><em>Safest Route</em></p>' : ''}
                `;
                card.onclick = () => selectRoute(index);
                routesContainer.appendChild(card);

                // Create route polyline
                if (route.path) {
                    const polyline = new google.maps.Polyline({
                        path: route.path,
                        strokeColor: isSafest ? '#4CAF50' : '#FF0000',
                        strokeWeight: isSafest ? 6 : 4,
                        strokeOpacity: 0.8,
                        map: map
                    });
                    routePolylines.push(polyline);
                }
            });

            // Set default selected route
            chosenRouteIndex = routes.findIndex(r => r.is_safest);
            if (chosenRouteIndex < 0) chosenRouteIndex = 0;
        }

        function displayDangerPoints() {
            dangerPointsData.forEach(point => {
                new google.maps.Marker({
                    position: { lat: point.lat, lng: point.lng },
                    map: map,
                    title: `${point.name} (Severity: ${point.danger_index})`,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        fillColor: getDangerColor(point.danger_index),
                        fillOpacity: 0.8,
                        strokeWeight: 1,
                        scale: 6
                    }
                });
            });
        }

        function getDangerColor(severity) {
            if (severity >= 4) return "red";
            if (severity === 3) return "orange";
            if (severity === 2) return "yellow";
            return "green";
        }

        function clearRoutes() {
            routePolylines.forEach(poly => poly.setMap(null));
            routePolylines = [];
        }

        function selectRoute(index) {
            chosenRouteIndex = index;
            routePolylines.forEach((poly, i) => {
                poly.setOptions({
                    strokeColor: (i === index) ? "#4CAF50" : "#FF0000",
                    strokeWeight: (i === index) ? 6 : 4
                });
            });
        }

        function startNavigation() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navStartTime = Date.now();
            document.getElementById("nav-info").innerText = 
                `Navigation started on Route #${chosenRouteIndex + 1} to ${currentDestination}.`;

            // Hide other routes
            routePolylines.forEach((poly, i) => {
                if (i !== chosenRouteIndex) poly.setMap(null);
                else {
                    poly.setOptions({
                        strokeColor: "#4CAF50",
                        strokeWeight: 6,
                        strokeOpacity: 1.0
                    });
                }
            });

            document.getElementById("start-nav").style.display = "none";
            document.getElementById("stop-nav").style.display = "inline-block";

            watchId = navigator.geolocation.watchPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const newPos = new google.maps.LatLng(lat, lng);

                    if (!userMarker) {
                        userMarker = new google.maps.Marker({
                            position: newPos,
                            map: map,
                            icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                            title: "You"
                        });
                    } else {
                        userMarker.setPosition(newPos);
                    }
                    map.setCenter(newPos);
                    updateNavInfo(newPos);
                    checkNearbyCrimes(newPos);
                },
                err => {
                    console.error("Navigation error:", err);
                    alert("Cannot track your position in real-time.");
                },
                { enableHighAccuracy: true }
            );
        }

        function stopNavigation() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (userMarker) {
                userMarker.setMap(null);
                userMarker = null;
            }
            navStartTime = null;
            document.getElementById("nav-info").innerText = "Navigation stopped.";
            document.getElementById("start-nav").style.display = "inline-block";
            document.getElementById("stop-nav").style.display = "none";
        }

        function updateNavInfo(currentPos) {
            if (!navStartTime) return;
            
            const request = {
                origin: currentPos,
                destination: currentDestination,
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, (response, status) => {
                if (status === "OK") {
                    const leg = response.routes[0].legs[0];
                    const dist = leg.distance.text;
                    const dur = leg.duration.text;

                    const elapsedMs = Date.now() - navStartTime;
                    let sec = Math.floor(elapsedMs / 1000);
                    const hh = Math.floor(sec / 3600);
                    sec %= 3600;
                    const mm = Math.floor(sec / 60);
                    const ss = sec % 60;
                    const elapsedStr = `${hh > 0 ? hh + 'h ' : ''}${mm > 0 ? mm + 'm ' : ''}${ss}s`;

                    document.getElementById("nav-info").innerHTML = `
                        <strong>Distance to ${currentDestination}:</strong> ${dist}<br>
                        <strong>Estimated Time:</strong> ${dur}<br>
                        <strong>Elapsed Time:</strong> ${elapsedStr}
                    `;
                }
            });
        }

        function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371; // Earth's radius in km
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const lat1Rad = toRad(lat1);
    const lat2Rad = toRad(lat2);
    
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1Rad) * Math.cos(lat2Rad) * 
            Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function toRad(deg) {
    return deg * (Math.PI/180);
}
function checkNearbyCrimes(currentPos) {
  if (!dangerPointsData || dangerPointsData.length === 0) return;
  
  dangerPointsData.forEach(dp => {
    // Ensure coordinates are numbers.
    const dpLat = parseFloat(dp.lat);
    const dpLng = parseFloat(dp.lng);
    const distance = haversine(currentPos.lat(), currentPos.lng(), dpLat, dpLng);
    const dpKey = `${dpLat}_${dpLng}`;
    
    console.log(`Distance to ${dp.name}: ${distance.toFixed(2)} km`);
    
    // Only trigger if distance is within 2 km and not nearly zero (to avoid false alerts at start)
    if (distance <= 2 && distance > 0.1) {
      if (!notifiedCrimes.has(dpKey)) {
        notifiedCrimes.add(dpKey);
        showNotification(`Safety Alert: ${dp.name} reported near ${dp.area}. Distance: ${distance.toFixed(2)} km.`);
        console.log(`Alert triggered for ${dp.name}`);
      }
    } else {
      // If outside range, remove from alerted set.
      if (notifiedCrimes.has(dpKey)) {
        notifiedCrimes.delete(dpKey);
        console.log(`Removed ${dp.name} from notified list (distance: ${distance.toFixed(2)} km)`);
      }
    }
  });
}


function showNotification(message) {
  const alertSound = document.getElementById("alertSound");
  if (alertSound) {
    alertSound.currentTime = 0; // Reset playback
    alertSound.play().catch(err => console.log("Sound playback error:", err));
  }
  const notif = document.getElementById("notification");
  notif.innerHTML = message;
  notif.style.display = "block";
  setTimeout(() => {
    notif.style.display = "none";
  }, 5000);
}



        function simulateMovement() {
            if (simulationInterval) return;
            
            simulationIndex = 0;
            notifiedCrimes.clear();

            simulationInterval = setInterval(() => {
                if (simulationIndex >= simulatedPath.length) {
                    clearInterval(simulationInterval);
                    simulationInterval = null;
                    return;
                }

                const pos = simulatedPath[simulationIndex];
                const newPos = new google.maps.LatLng(pos.lat, pos.lng);
                
                if (!userMarker) {
                    userMarker = new google.maps.Marker({
                        position: newPos,
                        map: map,
                        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                        title: "You (Simulated)"
                    });
                } else {
                    userMarker.setPosition(newPos);
                }
                
                map.setCenter(newPos);
                updateNavInfo(newPos);
                checkNearbyCrimes(newPos);
                
                simulationIndex++;
            }, 2000);
        }
    </script>
</body>
</html>
