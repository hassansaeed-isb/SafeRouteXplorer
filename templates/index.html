<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Route Map</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
    <!-- Load Google Maps JavaScript API with your API key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCoT1wmOma1cU-AC-GI2nOh8CT-bms_IkE&callback=initMap" async defer></script>
</head>
<body>
    <h2>Simple Route from Islamabad to Rawalpindi</h2>
    <div id="map"></div>

    <script>
        let map, directionsService, directionsRenderer;

        function initMap() {
            // Initialize the map centered at Islamabad
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 33.6844, lng: 73.0479 },  // Center map on Islamabad
                zoom: 10,
            });

            // Initialize Directions Service and Directions Renderer
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);

            // Call function to calculate and display the route
            calculateAndDisplayRoute();
        }

        function calculateAndDisplayRoute() {
            directionsService.route(
                {
                    origin: "Islamabad",  // Starting point
                    destination: "Rawalpindi",  // Ending point
                    travelMode: google.maps.TravelMode.DRIVING
                },
                (response, status) => {
                    if (status === "OK") {
                        directionsRenderer.setDirections(response);  // Display the route
                    } else {
                        console.error("Directions request failed due to " + status);
                    }
                }
            );
        }
    </script>
</body>
</html>
