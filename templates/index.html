<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRouteXplorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Mobile nav toggle button -->
    <div class="nav-toggle">
        <div class="hamburger"></div>
    </div>
    
    <!-- Main navigation sidebar -->
    <nav>
        <!-- Logo div that will use the background image from CSS -->
        <div class="logo"></div>
        <div class="nav-buttons">
            <button class="btn" id="enable-alerts">
                <i class="fas fa-bell"></i> Enable Alerts
            </button>
            <button class="btn" id="start-nav">
                <i class="fas fa-play"></i> Start Nav
            </button>
            <button class="btn" id="stop-nav" style="display:none;">
                <i class="fas fa-stop"></i> Stop Nav
            </button>
            <button class="btn" id="set-location">
                <i class="fas fa-map-marker-alt"></i> Set Route
            </button>
            <button class="btn" id="simulate-movement">
                <i class="fas fa-route"></i> Simulate
            </button>
        </div>
    </nav>

    <!-- Route title display -->
    <div class="safest-route-display">
        <h3>Safest Route from Rawalpindi to Islamabad</h3>
    </div>

    <!-- Navigation info panel -->
    <div id="nav-info">No navigation active.</div>
    
    <!-- Map container -->
    <div id="map"></div>
    
    <!-- Routes container -->
    <div id="routes-container"></div>
    
    <!-- Safety notification -->
    <div id="notification"></div>

    <!-- Mobile bottom navigation -->
    <div class="mobile-nav">
        <div class="mobile-nav-buttons">
            <div class="mobile-nav-btn" data-action="location">
                <i class="fas fa-map-marker-alt"></i>
                <span>Route</span>
            </div>
            <div class="mobile-nav-btn" data-action="start">
                <i class="fas fa-play"></i>
                <span>Start</span>
            </div>
            <div class="mobile-nav-btn" data-action="stop">
                <i class="fas fa-stop"></i>
                <span>Stop</span>
            </div>
            <div class="mobile-nav-btn" data-action="alerts">
                <i class="fas fa-bell"></i>
                <span>Alerts</span>
            </div>
            <div class="mobile-nav-btn" data-action="simulate">
                <i class="fas fa-route"></i>
                <span>Sim</span>
            </div>
        </div>
    </div>

    <!-- Mobile floating action button -->
    <div class="fab">
        <i class="fas fa-map-marker-alt" style="color: white; font-size: 20px;"></i>
    </div>

    <!-- Audio for alerts -->
    <audio id="alertSound">
        <source src="{{ url_for('static', filename='assets/sounds/alert.mp3') }}" type="audio/mpeg">
    </audio>

    <!-- Location Modal -->
    <div id="location-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Set Route Locations</h2>
            <form id="location-form">
                <div class="input-group">
                    <label for="start-location">Start Location:</label>
                    <input type="text" id="start-location" required placeholder="Enter starting point">
                </div>
                <div class="input-group">
                    <label for="end-location">End Location:</label>
                    <input type="text" id="end-location" required placeholder="Enter destination">
                </div>
                <button type="submit" class="btn">Find Safe Routes</button>
            </form>
        </div>
    </div>

    <!-- SRX Logo SVG for the nav bar (hidden, used as resource) -->
    <div style="display: none;">
        <svg id="srx-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">
            <defs>
                <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#a1c4fd" />
                </linearGradient>
            </defs>
            <text x="10" y="50" fill="url(#logo-gradient)" font-family="'Poppins', sans-serif" font-weight="800" font-size="40">SRX</text>
            <path d="M200 30 L220 50 L200 70" stroke="url(#logo-gradient)" stroke-width="5" fill="none" />
        </svg>
    </div>

    <!-- Load Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initApp" async defer></script>
    
    <!-- Load application scripts -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/routes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/simulation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
