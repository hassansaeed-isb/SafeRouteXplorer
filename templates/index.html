<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRouteXplorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-fixes.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="/static/manifest.json">

</head>
<body>
    <!-- Logo in top right corner -->
    <div class="srx-logo">
        <img src="{{ url_for('static', filename='assets/images/srx-logo.png') }}" alt="SRX Logo">
    </div>
    
    <!-- Set Location Button -->
    <div class="set-location-container">
        <button id="set-location" class="set-location-btn">
            <i class="fas fa-map-marker-alt"></i> Set Route
        </button>
    </div>

    <!-- Route title display -->
    <div class="safest-route-display">
        <h3>Safest Route from Rawalpindi to Islamabad</h3>
    </div>

    <!-- Navigation info panel -->
    <div id="nav-info">No navigation active.</div>
    
    <!-- Map container -->
    <div id="map"></div>
    
    <!-- Routes container - now full width -->
    <div id="routes-container"></div>
    
    <!-- Control buttons -->
    <div class="map-controls">
        <button id="start-nav" class="control-btn">
            <i class="fas fa-play"></i>
        </button>
        <button id="stop-nav" class="control-btn" style="display:none;">
            <i class="fas fa-stop"></i>
        </button>
       
        <button id="simulate-movement" class="control-btn">
            <i class="fas fa-route"></i>
        </button>
    </div>
    
    <!-- Safety notification -->
    <div id="notification"></div>

    <!-- Mobile Set Route button at bottom -->
    <div class="mobile-set-route">
        <button id="mobile-set-location">
            <i class="fas fa-map-marker-alt"></i> Set Route
        </button>
    </div>

    <!-- Audio for alerts -->
    <audio id="alertSound">
        <source src="{{ url_for('static', filename='assets/sounds/alert.mp3') }}" type="audio/mpeg">
    </audio>

    <!-- Location Modal -->
    <div id="location-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Set Route Locations</h2>
            <form id="location-form">
                <div class="input-group">
                    <label for="start-location">Start Location:</label>
                    <input type="text" id="start-location" required placeholder="Enter starting point">
                </div>
                <div class="input-group">
                    <label for="end-location">End Location:</label>
                    <input type="text" id="end-location" required placeholder="Enter destination">
                </div>
                <button type="submit" class="btn">Find Safe Routes</button>
            </form>
        </div>
    </div>
    <script>
        // This function is called by the Google Maps API
        function initMap() {
    const mapOptions = {
        center: { lat: 33.6844, lng: 73.0479 },
        zoom: 12,
        styles: mapStyle,
        // ... other options
    };
    
    map = new google.maps.Map(document.getElementById("map"), mapOptions);
    directionsService = new google.maps.DirectionsService();
    
    // Add custom controls
    addCustomControls();

    // OPTIONAL: Wait until the map is idle before enabling route actions
    google.maps.event.addListenerOnce(map, 'idle', () => {
        console.log("Map is fully loaded and idle.");
        // If you wish, you can trigger a default route fetch here.
    });
    
    return map;
}

      </script>
      
    
    <!-- Update the Google Maps API script to include the Places library -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&libraries=places&callback=initApp" async defer></script>

    
    <!-- Load application scripts -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notification.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/routes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/simulation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mobile-fix.js') }}"></script>
    <script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>

        }
      </script> -->
      
</body>
</html>
