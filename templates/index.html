<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRouteXplorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
</head>
<body>
    <nav>
        <div class="logo">SafeRouteXplorer</div>
        <div class="nav-buttons">
            <button class="btn" id="enable-alerts">Enable Real-Time Safety Alerts</button>
            <button class="btn" id="start-nav">Start Navigation</button>
            <button class="btn" id="stop-nav" style="display:none;">Stop Navigation</button>
            <button class="btn" id="set-location">Set Location</button>
            <button class="btn" id="simulate-movement">Simulate Movement</button>
        </div>
    </nav>

    <div class="safest-route-display">
        <h3>Safest Route from Rawalpindi to Islamabad</h3>
    </div>

    <div id="nav-info">No navigation active.</div>
    <div id="map"></div>
    <div id="routes-container"></div>
    <div id="notification"></div>

    <!-- Audio for alerts -->
    <audio id="alertSound">
        <!--<source src="{{ url_for('static', filename='assets/sounds/alert.ogg') }}" type="audio/ogg">-->
        <source src="{{ url_for('static', filename='assets/sounds/alert.mp3') }}" type="audio/mpeg">
    </audio>

    <!-- Location Modal -->
    <div id="location-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Set Route Locations</h2>
            <form id="location-form">
                <div class="input-group">
                    <label for="start-location">Start Location:</label>
                    <input type="text" id="start-location" required placeholder="Enter starting point">
                </div>
                <div class="input-group">
                    <label for="end-location">End Location:</label>
                    <input type="text" id="end-location" required placeholder="Enter destination">
                </div>
                <button type="submit" class="btn">Find Safe Routes</button>
            </form>
        </div>
    </div>

    <!-- Load Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initApp" async defer></script>
    
    <!-- Load application scripts -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/routes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/simulation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
